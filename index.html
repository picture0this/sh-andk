<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شعندك؟</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ======= الهيدر: أسماء الفرق + النقاط + العنوان ======= -->
  <header class="topbar">
    <div class="team-panel" id="teamPanel1">
      <div class="pick-card" id="pickCard1" hidden>
        <span>اختر البطاقة هنا</span>
        <button class="pick-btn" type="button">+</button>
      </div>
      <label class="team-label" for="teamName1">الفريق الاول:</label>
      <input class="team-name" id="teamName1" type="text" placeholder="اسم الفريق" maxlength="20">
      <div class="score-row">
        <button class="score-btn" data-team="0" data-delta="-1" type="button">−</button>
        <span class="score" id="score1">0</span>
        <button class="score-btn" data-team="0" data-delta="1" type="button">+</button>
      </div>
    </div>

    <h1 class="game-title">شعندك؟</h1>

    <div class="team-panel" id="teamPanel2">
      <div class="pick-card" id="pickCard2" hidden>
        <span>اختر البطاقة هنا</span>
        <button class="pick-btn" type="button">+</button>
      </div>
      <label class="team-label" for="teamName2">الفريق الثاني:</label>
      <input class="team-name" id="teamName2" type="text" placeholder="اسم الفريق" maxlength="20">
      <div class="score-row">
        <button class="score-btn" data-team="1" data-delta="-1" type="button">−</button>
        <span class="score" id="score2">0</span>
        <button class="score-btn" data-team="1" data-delta="1" type="button">+</button>
      </div>
    </div>
  </header>
  <div class="topbar-underline"></div>

  <!-- ======= الشاشة الرئيسية: الفئات الست ======= -->
  <main id="screens">
    <section class="screen active" id="screen-home">
      <div class="win-limit-row">
        <label for="winLimit">نقاط الفوز:</label>
        <input id="winLimit" type="number" min="100" step="100" value="1200">
      </div>
      <div class="main-grid" id="mainGrid"></div>
    </section>

    <!-- ======= شاشة الفئات الفرعية (خمن الصورة) ======= -->
    <section class="screen" id="screen-sub">
      <div class="sub-row" id="subRow"></div>
    </section>

    <!-- ======= شاشة الفئات الفرعية (خلك صريح) ======= -->
    <section class="screen" id="screen-honest-sub">
      <div class="sub-row" id="honestRow"></div>
    </section>

    <!-- ======= شاشة سؤال "خلك صريح" ======= -->
    <section class="screen" id="screen-honest-q">
      <p class="honest-question" id="honestQuestion"></p>
      <div class="honest-btns">
        <button class="big-btn answer" id="honestAnswerBtn" type="button">جاوب</button>
        <button class="big-btn" id="honestSkipBtn" type="button">امتنع عن الاجابة</button>
      </div>
    </section>

    <!-- ======= شاشة اختيار فئات "سؤال و جواب" ======= -->
    <section class="screen" id="screen-qa-pick">
      <p class="qa-hint">اختاروا لين ٦ فئات</p>
      <div class="sub-row" id="qaPickRow"></div>
      <button class="big-btn start-btn" id="qaStartBtn" type="button" disabled>بلش!</button>
    </section>

    <!-- ======= لوحة "سؤال و جواب" ======= -->
    <section class="screen" id="screen-qa-board">
      <div class="qa-board" id="qaBoard"></div>
    </section>

    <!-- ======= شاشة السؤال ======= -->
    <section class="screen" id="screen-qa-q">
      <div id="qaTimerSlot"></div>
      <div class="timer-btns qa-timer-btns">
        <button class="icon-btn" id="qaTimerResetBtn" title="إعادة العدّاد" type="button">&#8634;</button>
        <button class="icon-btn" id="qaTimerPauseBtn" title="إيقاف مؤقت" type="button">&#10074;&#10074;</button>
      </div>
      <p class="qa-team" id="qaTurnLabel"></p>
      <p class="qa-meta" id="qaMeta"></p>
      <p class="honest-question" id="qaQuestion"></p>
      <p class="qa-answer" id="qaAnswer" hidden></p>
      <button class="big-btn" id="qaRevealBtn" type="button">الجواب</button>
      <div class="honest-btns" id="qaAwardRow" hidden>
        <button class="big-btn answer" id="qaTeam1Btn" type="button"></button>
        <button class="big-btn answer" id="qaTeam2Btn" type="button"></button>
        <button class="big-btn" id="qaNoneBtn" type="button">محد جاوب</button>
      </div>
    </section>

    <!-- ======= شاشة "سمّ!" ======= -->
    <section class="screen" id="screen-name">
      <div id="nameTimerSlot"></div>
      <div class="timer-btns qa-timer-btns">
        <button class="icon-btn" id="nameTimerResetBtn" title="إعادة العدّاد" type="button">&#8634;</button>
        <button class="icon-btn" id="nameTimerPauseBtn" title="إيقاف مؤقت" type="button">&#10074;&#10074;</button>
      </div>
      <p class="qa-team" id="nameTurnLabel"></p>
      <p class="honest-question" id="nameChallenge"></p>
      <div class="name-counter">
        <button class="count-btn" id="nameMinusBtn" type="button">−</button>
        <span class="name-count" id="nameCount">0</span>
        <button class="count-btn" id="namePlusBtn" type="button">+</button>
      </div>
      <button class="big-btn answer" id="nameDoneBtn" type="button">خلصنا!</button>
    </section>

    <!-- ======= نتيجة "سمّ!" ======= -->
    <section class="screen" id="screen-name-result">
      <h2 class="name-result-title" id="nameResultTitle"></h2>
      <p class="qa-meta" id="nameResultDetail"></p>
      <button class="big-btn start-btn" id="nameAgainBtn" type="button">جولة ثانية</button>
    </section>

    <!-- ======= شاشة بداية "ولا كلمة" ======= -->
    <section class="screen" id="screen-noword-start">
      <button class="big-btn start-btn" id="nowordStartBtn" type="button">بلش!</button>
    </section>

    <!-- ======= شاشة الباركود (فريق واحد) ======= -->
    <section class="screen" id="screen-qr">
      <p class="qr-team-label" id="qrTeamLabel"></p>
      <div class="qr-box"><div id="qrHolder"></div></div>
      <button class="big-btn" id="qrNextBtn" type="button">Next</button>
    </section>

    <!-- ======= شاشة العدّاد ======= -->
    <section class="screen" id="screen-timer">
      <div id="timerSlot">
      <div class="timer-wrap" id="timerWrap">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
        </svg>
        <span class="timer-num" id="timerNum">30</span>
      </div>
      </div>
      <div class="timer-btns" id="guessTimerBtns">
        <button class="icon-btn" id="timerResetBtn" title="إعادة العدّاد" type="button">&#8634;</button>
        <button class="icon-btn" id="timerPauseBtn" title="إيقاف مؤقت" type="button">&#10074;&#10074;</button>
        <button class="icon-btn check" id="timerNextBtn" title="تم التخمين!" type="button">&#10004;</button>
      </div>
      <div class="timer-btns" id="nowordTimerBtns" hidden>
        <button class="icon-btn" id="nowordResetBtn" title="إعادة العدّاد" type="button">&#8634;</button>
        <button class="icon-btn" id="nowordPauseBtn" title="إيقاف مؤقت" type="button">&#10074;&#10074;</button>
        <button class="icon-btn wrong" id="nowordWrongBtn" title="ما عرفوها" type="button">&#10006;</button>
        <button class="icon-btn check" id="nowordRightBtn" title="عرفوها!" type="button">&#10004;</button>
      </div>
    </section>

    <!-- ======= شاشة كشف البطاقتين + الفائز ======= -->
    <section class="screen" id="screen-reveal">
      <div class="reveal-grid">
        <div class="reveal-col">
          <p class="reveal-team" id="revealName1"></p>
          <div class="qr-box small"><div id="revealQr1"></div></div>
          <button class="big-btn winner-btn" data-team="0" type="button">Winner?</button>
        </div>
        <div class="reveal-col">
          <p class="reveal-team" id="revealName2"></p>
          <div class="qr-box small"><div id="revealQr2"></div></div>
          <button class="big-btn winner-btn" data-team="1" type="button">Winner?</button>
        </div>
      </div>
      <button class="ghost-btn" id="noWinnerBtn" type="button">بدون فائز — رجوع</button>
    </section>
  </main>

  <!-- ======= شعار الكلية + زر الرئيسية ======= -->
  <footer class="bottombar">
    <img class="ktech-logo" src="assets/ktech-logo.png" alt="ktech">
    <div class="footer-btns">
      <button class="home-btn" id="qaResetBtn" title="إعادة اختيار الفئات" hidden type="button">&#8635;</button>
      <button class="home-btn" id="homeBtn" title="الرئيسية" hidden type="button">&#8962;</button>
    </div>
  </footer>

  <!-- ======= نافذة الفوز ======= -->
  <div class="overlay" id="winOverlay" hidden>
    <div class="overlay-card">
      <div class="confetti">&#127881;</div>
      <h2 id="winnerText"></h2>
      <p>وصل إلى نقاط الفوز!</p>
      <div class="overlay-btns">
        <button class="big-btn" id="newGameBtn" type="button">لعبة جديدة</button>
        <button class="ghost-btn" id="keepPlayingBtn" type="button">استمرار باللعب</button>
      </div>
    </div>
  </div>

  <!-- ======= تأكيد إعادة اختيار الفئات ======= -->
  <div class="overlay" id="qaResetOverlay" hidden>
    <div class="overlay-card">
      <h2>إعادة اختيار الفئات؟</h2>
      <p>بترجعون لصفحة اختيار الفئات وتنفتح كل الأسئلة من جديد.</p>
      <div class="overlay-btns">
        <button class="big-btn" id="qaResetOkBtn" type="button">حسنا</button>
        <button class="ghost-btn" id="qaResetCancelBtn" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/qrcode.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
